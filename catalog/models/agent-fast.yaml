# Alias rapide et économique (MGW-01). gpt-4.1-nano choisi le 18/11/2026 (remplace gpt-5-mini, PO-18).
# Modèle au statut « Legacy » chez Microsoft : fin de support le 14/04/2027, remplacement à préparer avant.
alias: agent-fast
owner: ai-platform-team
status: active
provider: azure
model: gpt-4.1-nano
model_version: "2025-04-14"
model_format: OpenAI
deployment_name: agent-fast-gpt-4-1-nano
deployment_type: DataZoneStandard
region: francecentral
protocol: responses
context_window: 1047576          # fenêtre de contexte publiée pour gpt-4.1-nano
max_output_tokens: 4096
max_request_kb: 1024
capabilities: [streaming, tools]
pricing:                         # EUR par million de tokens, Data Zone (prix publics Azure du 18/11/2026,
  input: 0.1                     # publiés arrondis par millier de tokens : à affiner, PO-18)
  cached_input: 0.025
  output: 0.4
limits:
  capacity_thousand_tpm:         # quota Data Zone France Central de l'abonnement : 2000
    dev: 1000                      # pilote N2 en dev
    prod: 500
offers: [model-gateway]
end_of_support: "2027-04-14"
review_date: "2027-01-15"        # choisir le successeur avant la fin de support
