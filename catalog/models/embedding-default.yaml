# Alias d'embeddings (MGW-15, ADR-19). text-embedding-3-small : meilleur rapport qualité/prix des embeddings Azure OpenAI.
# Vérifié le 2026-11-24 avec `az cognitiveservices model list` (PO-20) : disponible en DataZoneStandard depuis
# France Central, version 1, retrait de l'inférence le 2028-02-09. Reste à confirmer (PO-20) : tarif en EUR.
alias: embedding-default
kind: embedding
owner: ai-platform-team
status: active
provider: azure
model: text-embedding-3-small
model_version: "1"
model_format: OpenAI
deployment_name: embedding-default-text-embedding-3-small
deployment_type: DataZoneStandard
region: francecentral
protocol: embeddings              # ADR-19
context_window: 8191              # tokens d'entrée maximum par texte (publié pour text-embedding-3-small)
max_request_kb: 1024
capabilities: [embeddings]
pricing:                          # EUR par million de tokens d'entrée ; pas de tokens de sortie. Valeur à confirmer (PO-20).
  input: 0.0185                   # environ 0,02 USD : à remplacer par le prix public Data Zone en EUR
  output: 0
limits:
  capacity_thousand_tpm:          # limite d'abonnement Data Zone France Central : 1000 (vérifiée) ; valeurs ci-dessous = choix de répartition
    dev: 100
    prod: 50
offers: [model-gateway]
end_of_support: "2028-02-09"      # retrait de l'inférence publié par Azure (vérifié, PO-20)
review_date: "2027-01-15"
