# Alias généraliste (MGW-01). Choisi le 18/11/2026 (décision n°4 de docs/suivi/a-faire-v1.md, PO-04 vérifié).
alias: agent-general
owner: ai-platform-team
status: active                   # draft | active | deprecated
provider: azure
model: gpt-6-luna
